[project]
name = "identity-asset-graph"
version = "0.1.0"
description = "Identity - Asset Graph and Attack Path Analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.6.1",
    "pandas>=3.0.5",
]

[project.scripts]
identity-asset-graph = "identity_asset_graph:main"

[build-system]
requires = ["uv_build>=0.10.0"]
build-backend = "uv_build"
